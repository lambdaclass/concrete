name = "concrete"
version = "0.1.0"
defaultTargets = ["concrete", "Examples", "DesignExamples", "pipeline-test", "concrete-browser-native"]

[leanOptions]
warningAsError = true

[[lean_lib]]
name = "Concrete"

# Flagship / example CORRECTNESS proofs (srcDir proofs/, root proofs/Examples.lean,
# modules + namespaces `Examples.<Ex>.Proofs`). Separated from the compiler lib so
# `Concrete` reflects implementation only; kept in defaultTargets so `lake build`
# still kernel-checks them. srcDir avoids a case-collision with the .con `examples/`.
[[lean_lib]]
name = "Examples"
srcDir = "proofs"

# Verified-pipeline DESIGN EXAMPLES (ROADMAP row 3, R-0511; docs/compiler/VERIFIED_PIPELINE.md
# "Early semantic risk retirement"): small self-contained models of move/destroy, borrows and
# reborrowing, cleanup and typed-value representation. They import NOTHING from the compiler,
# so they test the plan's intended design rather than today's implementation. Root
# proofs/DesignExamples.lean; see proofs/DesignExamples/README.md.
[[lean_lib]]
name = "DesignExamples"
srcDir = "proofs"

[[lean_exe]]
name = "concrete"
root = "Main"

[[lean_exe]]
name = "pipeline-test"
root = "Concrete.Pipeline.PipelineTest"

# Browser adapter (the native twin of the site's Wasm compiler; scripts/browser/README.md). Not part
# of the native CLI, but a DEFAULT TARGET: outside defaultTargets nothing built it, and it stopped
# compiling for a week before anyone noticed (bug 316). check_browser_native.sh runs it.
[[lean_exe]]
name = "concrete-browser-native"
root = "Browser"
