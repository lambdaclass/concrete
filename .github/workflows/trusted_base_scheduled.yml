name: Trusted base fresh audit
on:
  schedule:
    - cron: '17 3 * * 1-6'
    - cron: '17 3 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trusted-base-fresh
  cancel-in-progress: false
jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Install protected owner trust anchor
        env:
          OWNER_SIGNERS: ${{ vars.CONCRETE_OWNER_ALLOWED_SIGNERS }}
        run: |
          test -n "$OWNER_SIGNERS"
          printf '%s\n' "$OWNER_SIGNERS" > "$RUNNER_TEMP/owner-signers"
      - name: Full fresh traced compiler and LCB audit
        env:
          CONCRETE_OWNER_ALLOWED_SIGNERS: ${{ runner.temp }}/owner-signers
        run: nix develop --command bash scripts/checks/compiler/slice0_trusted_fresh.sh
      - name: Weekly verify and rebuild the pinned tool roots
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * 0'
        run: nix develop --command bash scripts/checks/compiler/slice0_trusted_store.sh
