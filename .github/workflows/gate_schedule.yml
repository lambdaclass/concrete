name: Scheduled gate tiers
run-name: scheduled-${{ github.event_name == 'schedule' && (github.event.schedule == '43 3 * * 0' && 'weekly' || 'daily') || 'replay' }}
on:
  schedule:
    - cron: '17 2 * * *'
    - cron: '43 3 * * 0'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full main-history SHA to replay (required for dispatch)'
        type: string
        required: true
      tier:
        description: 'Tier to replay'
        type: choice
        options: [daily, weekly]
        required: true
permissions:
  contents: read
jobs:
  select:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.select.outputs.sha }}
      tier: ${{ steps.select.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          REQUESTED_TIER: ${{ inputs.tier }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          source scripts/checks/lib/scheduled_process.sh
          if [ "$EVENT" = schedule ]; then
            tier=daily
            if [ "$CRON" = '43 3 * * 0' ]; then tier=weekly; fi
            echo "SCHEDULE_SELECTION $GITHUB_SHA $tier"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "tier=$tier" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha=$(bounded_run 30 -- python3 scripts/checks/scheduled/history.py "$REQUESTED_SHA")
          tier="$REQUESTED_TIER"
          [[ "$tier" = daily || "$tier" = weekly ]]
          echo "SCHEDULE_SELECTION $sha $tier"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
  campaign:
    needs: select
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, x64, concrete, concrete-ci-2]
    timeout-minutes: 1440
    permissions:
      contents: read
    concurrency:
      group: scheduled-note-${{ needs.select.outputs.tier }}
      cancel-in-progress: false
    steps:
      - name: Refuse substitute runner
        if: runner.environment != 'self-hosted'
        run: |
          echo 'forged runner: not inventoried concrete-ci-2'
          exit 1
      # Controller is trusted main; old replay SHAs do not supply the controller.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Run exact-SHA tier
        env:
          SELECTED_SHA: ${{ needs.select.outputs.sha }}
          SELECTED_TIER: ${{ needs.select.outputs.tier }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          OCCURRENCE: ${{ github.event.schedule || format('replay/{0}', github.run_id) }}
        run: |
          set -euo pipefail
          state=$(mktemp -d)
          trap 'rm -rf "$state"' EXIT
          python3 scripts/checks/lib/scheduled_process.py --cwd "$PWD" --timeout 80000 -- nix develop --command python3 scripts/checks/scheduled/run.py "$SELECTED_SHA" "$SELECTED_TIER" result-index
      - name: Upload bounded metadata for trusted collection
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-index-${{ needs.select.outputs.tier }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: result-index/index.json
          if-no-files-found: error
          retention-days: 90
      - id: result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-${{ needs.select.outputs.tier }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: result-index/
          if-no-files-found: error
          retention-days: 90
