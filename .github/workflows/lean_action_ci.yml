name: CI

# The root's CI after the legacy/ move. Twenty-one jobs, all required (required-checks.txt):
#   Landing record  main's push run names the run that qualified its exact SHA (R-0570), kept from
#                the base unchanged; when it finds one, the jobs below are skipped on main.
#   Root checks  every check of scripts/checks/run.sh: legacy/ frozen, the day-one root inventory,
#                workflow YAML, Markdown links, the landing script and readiness, the review tool.
#   Spec build   lake build of the specification, warnings refused.
#   Proof axioms, Proof trust ban (sorry, native_decide), Kernel replay (leanchecker), External
#                re-check (con-leche, nanoda)  the proof-integrity checks of scripts/proofs.
#   Tests, determinism, scaling, Slice 0 artifacts, trusted base, reproducibility (x86-64 Linux and AArch64 macOS)
#                the compiler's gates (scripts/checks/compiler), each in the compiler's devshell.
#   Oracle (GitHub-hosted fetch + smoke)  the published oracle fetched, verified and run on a
#                GitHub-hosted runner (ISS-0005, P13; R-0564), kept from the base unchanged.
# legacy/ is never built or run here: its gates were qualified at tag legacy-compiler-final. The old
# workflows are archived, unrun, under legacy/.github/workflows.
# A train's dispatch names its base: the run's title then says which base it was built on, and
# main's Landing record accepts a run only for the base main had before the push (R-0570).
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.base != '' && format('{0} at base {1}', github.ref_name, inputs.base) || '' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        # THE BASE OF A TRAIN'S CANDIDATE, passed by train.sh ci (-f base=<sha>). The root has no
        # base-sensitive check yet; the title records the base so main's Landing record can require
        # that the run it accepts was built on the base main had before the landing.
        description: "Base SHA of a train's candidate (recorded in the run title)"
        type: string
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

# Every run step executes in the gate userland (flake.nix, `gates` shell), which marks itself with
# CONCRETE_GATES_SHELL=1; scripts/checks/lib/gate_env.sh refuses anywhere else. It contains no Lean:
# lean-action's elan toolchain is the one on PATH in the spec job.
defaults:
  run:
    shell: "nix develop .#gates --command bash --noprofile --norc -eo pipefail {0}"

jobs:
  # MAIN'S RUN NAMES THE RUN THAT QUALIFIED ITS EXACT SHA (R-0570), as in the base's workflow. On a
  # push to main this job looks up, with train.sh record, a completed dispatch of this workflow at
  # exactly this SHA and at the base main had before the push, with every required job succeeded.
  # Found: every other job is skipped and the run links it. Not found, or any other event: every job
  # runs. Each job below needs it and carries the gate; check_landing_script.sh holds both.
  landing-record:
    name: Landing record
    runs-on: ${{ (github.event_name != 'pull_request' && vars.CONCRETE_SELF_HOSTED == 'true') && fromJSON('["self-hosted","linux","x64","concrete"]') || 'ubuntu-latest' }}
    timeout-minutes: 16
    permissions:
      actions: read
      contents: read
    outputs:
      recorded: ${{ steps.record.outputs.recorded }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Install Nix (GitHub-hosted only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.environment != 'self-hosted'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: "Look up the run that qualified this exact SHA (none found: every job runs here)"
        id: record
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          LAND_REPO: unbalancedparentheses/concrete2
          LAND_NO_NIX: "1"
        run: python3 scripts/checks/lib/gate_manifest.py execute --id landing-record --tier ${{ github.event_name == 'pull_request' && 'pr' || 'qualification' }}

  root-checks:
    name: Root checks
    needs: landing-record
    if: ${{ !cancelled() && needs.landing-record.outputs.recorded != 'true' }}
    # Self-hosted runners never take pull_request events (forks could run code on them).
    runs-on: ${{ (github.event_name != 'pull_request' && vars.CONCRETE_SELF_HOSTED == 'true') && fromJSON('["self-hosted","linux","x64","concrete"]') || 'ubuntu-latest' }}
    timeout-minutes: 55
    steps:
      # Full history: legacy_frozen.sh reads the move commit named in scripts/checks/legacy.lock.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix (GitHub-hosted only)
        if: runner.environment != 'self-hosted'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Root checks (scripts/checks/run.sh)
        run: python3 scripts/checks/lib/gate_manifest.py execute --id root-checks --tier ${{ github.event_name == 'pull_request' && 'pr' || 'qualification' }}

  spec:
    name: Spec build
    needs: landing-record
    if: ${{ !cancelled() && needs.landing-record.outputs.recorded != 'true' }}
    runs-on: ${{ (github.event_name != 'pull_request' && vars.CONCRETE_SELF_HOSTED == 'true') && fromJSON('["self-hosted","linux","x64","concrete"]') || 'ubuntu-latest' }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (GitHub-hosted only)
        if: runner.environment != 'self-hosted'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install Lean (via lean-action)
        id: lean_install
        # A toolchain download can fail on a dropped connection; one paused retry keeps a network
        # blip from failing (and hiding) the whole run.
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          build-args: "--log-level=warning"

      - name: Wait before retrying the Lean install
        if: steps.lean_install.outcome == 'failure'
        run: sleep 60

      - name: Install Lean (via lean-action) (retry)
        if: steps.lean_install.outcome == 'failure'
        uses: leanprover/lean-action@v1
        with:
          build-args: "--log-level=warning"

      - name: Build the specification, warnings refused
        run: python3 scripts/checks/lib/gate_manifest.py execute --id spec --tier ${{ github.event_name == 'pull_request' && 'pr' || 'qualification' }}

  # PROOF INTEGRITY (scripts/proofs). Four jobs, each required, each with its own negative controls:
  # the per-theorem axiom inventory against its golden list, the transitive sorry/native_decide ban,
  # the fresh kernel replay (leanchecker) and the independent re-check (con-leche, nanoda). The spec
  # is built in each (lean-action); a failed build fails the job before the check runs.
  proof-axioms:
    name: Proof axioms
    needs: landing-record
    if: ${{ !cancelled() && needs.landing-record.outputs.recorded != 'true' }}
    runs-on: ${{ (github.event_name != 'pull_request' && vars.CONCRETE_SELF_HOSTED == 'true') && fromJSON('["self-hosted","linux","x64","concrete"]') || 'ubuntu-latest' }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (GitHub-hosted only)
        if: runner.environment != 'self-hosted'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install Lean and build the specification (via lean-action)
        id: lean_install
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          build-args: "--log-level=warning"

      - name: Wait before retrying the Lean install
        if: steps.lean_install.outcome == 'failure'
        run: sleep 60

      - name: Install Lean and build the specification (via lean-action) (retry)
        if: steps.lean_install.outcome == 'failure'
        uses: leanprover/lean-action@v1
        with:
          build-args: "--log-level=warning"

      - name: Proof axioms (scripts/proofs/axioms.sh)
        run: python3 scripts/checks/lib/gate_manifest.py execute --id proof-axioms --tier ${{ github.event_name == 'pull_request' && 'pr' || 'qualification' }}

  proof-trust-ban:
    name: Proof trust ban (sorry, native_decide)
    needs: landing-record
    if: ${{ !cancelled() && needs.landing-record.outputs.recorded != 'true' }}
    runs-on: ${{ (github.event_name != 'pull_request' && vars.CONCRETE_SELF_HOSTED == 'true') && fromJSON('["self-hosted","linux","x64","concrete"]') || 'ubuntu-latest' }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (GitHub-hosted only)
        if: runner.environment != 'self-hosted'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install Lean and build the specification (via lean-action)
        id: lean_install
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          build-args: "--log-level=warning"

      - name: Wait before retrying the Lean install
        if: steps.lean_install.outcome == 'failure'
        run: sleep 60

      - name: Install Lean and build the specification (via lean-action) (retry)
        if: steps.lean_install.outcome == 'failure'
        uses: leanprover/lean-action@v1
        with:
          build-args: "--log-level=warning"

      - name: Proof trust ban (sorry, native_decide) (scripts/proofs/trust_ban.sh)
        run: python3 scripts/checks/lib/gate_manifest.py execute --id proof-trust-ban --tier ${{ github.event_name == 'pull_request' && 'pr' || 'qualification' }}

  kernel-replay:
    name: Kernel replay (leanchecker)
    needs: landing-record
    if: ${{ !cancelled() && needs.landing-record.outputs.recorded != 'true' }}
    runs-on: ${{ (github.event_name != 'pull_request' && vars.CONCRETE_SELF_HOSTED == 'true') && fromJSON('["self-hosted","linux","x64","concrete"]') || 'ubuntu-latest' }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (GitHub-hosted only)
        if: runner.environment != 'self-hosted'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install Lean and build the specification (via lean-action)
        id: lean_install
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          build-args: "--log-level=warning"

      - name: Wait before retrying the Lean install
        if: steps.lean_install.outcome == 'failure'
        run: sleep 60

      - name: Install Lean and build the specification (via lean-action) (retry)
        if: steps.lean_install.outcome == 'failure'
        uses: leanprover/lean-action@v1
        with:
          build-args: "--log-level=warning"

      - name: Kernel replay (leanchecker) (scripts/proofs/kernel_replay.sh)
        run: python3 scripts/checks/lib/gate_manifest.py execute --id kernel-replay --tier ${{ github.event_name == 'pull_request' && 'pr' || 'qualification' }}

  # lean4export, con-leche and nanoda are built once per pinned revision (scripts/proofs/external.pins)
  # into ~/.cache/concrete-ext; nanoda needs cargo, so the check runs in the extcheck shell.
  external-recheck:
    name: External re-check (con-leche, nanoda)
    needs: landing-record
    if: ${{ !cancelled() && needs.landing-record.outputs.recorded != 'true' }}
    runs-on: ${{ (github.event_name != 'pull_request' && vars.CONCRETE_SELF_HOSTED == 'true') && fromJSON('["self-hosted","linux","x64","concrete"]') || 'ubuntu-latest' }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (GitHub-hosted only)
        if: runner.environment != 'self-hosted'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache pinned external tools (lean4export, con-leche, nanoda)
        uses: actions/cache@v4
        with:
          path: ~/.cache/concrete-ext
          key: ${{ runner.os }}-concrete-ext-${{ hashFiles('scripts/proofs/external.pins', 'lean-toolchain') }}

      - name: Install Lean and build the specification (via lean-action)
        id: lean_install
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          build-args: "--log-level=warning"

      - name: Wait before retrying the Lean install
        if: steps.lean_install.outcome == 'failure'
        run: sleep 60

      - name: Install Lean and build the specification (via lean-action) (retry)
        if: steps.lean_install.outcome == 'failure'
        uses: leanprover/lean-action@v1
        with:
          build-args: "--log-level=warning"

      - name: External re-check (con-leche, nanoda) (scripts/proofs/external.sh)
        shell: "nix develop .#extcheck --command bash --noprofile --norc -eo pipefail {0}"
        run: python3 scripts/checks/lib/gate_manifest.py execute --id external-recheck --tier ${{ github.event_name == 'pull_request' && 'pr' || 'qualification' }}

  # The oracle check on a GitHub-hosted runner (ISS-0005, P13; R-0564): proves that a runner other than
  # concrete-ci-2 gets a verified oracle from the release alone. A missing, corrupt or unverifiable
  # artifact makes ci_check.sh exit 3 (INCOMPLETE) and the job fail: it is never reported as passed.
  # It is a GitHub-hosted job, so a pull_request may run it (no self-hosted runner is involved).
  oracle-hosted:
    name: Oracle (GitHub-hosted fetch + smoke)
    needs: landing-record
    if: ${{ !cancelled() && needs.landing-record.outputs.recorded != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: "Oracle fetch (missing, corrupt or unverifiable artifact is INCOMPLETE; negative controls)"
        run: python3 scripts/checks/lib/gate_manifest.py execute --id oracle-hosted-1 --tier ${{ github.event_name == 'pull_request' && 'pr' || 'qualification' }}

      - name: "Fetch the published oracle, verify it, run smoke.con through it (exit 42)"
        run: python3 scripts/checks/lib/gate_manifest.py execute --id oracle-hosted-2 --tier ${{ github.event_name == 'pull_request' && 'pr' || 'qualification' }}

  # THE COMPILER'S GATES (Concrete/README.md gates 4, 6, 6a, 8–14; slice 0, provisional),
  # scripts/checks/compiler/: not root checks (run.sh runs only scripts/checks/*.sh), because they need
  # the compiler's devshell, a native macOS runner and minutes each. Every bir: row in the test manifest
  # through the LLVM path and the LCB path, each executable's observation compared with the manifest
  # expectation; sanitizers, binary size (report-only) and the stack bound; the trusted-base golden;
  # every build stage reproduced in distinct directories and on distinct machines; per-test determinism
  # from one compiler build; and interleaved scaling. Scaling runs only on x86-64 Linux; the other native
  # matrix gates run on x86-64 Linux and AArch64 macOS, and every matrix leg is a required job of its own.
  tests:
    name: Tests (${{ matrix.arch }})
    needs: landing-record
    if: ${{ !cancelled() && needs.landing-record.outputs.recorded != 'true' }}
    # The compiler's devshell (flake.nix default: Lean, clang, LLVM, gdb/lldb), entered per step;
    # the gates shell has no Lean.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-latest
          - arch: aarch64-macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Manifest tests (LLVM and LCB, native)
        run: nix develop --command bash scripts/checks/compiler/tests.sh

  determinism:
    name: Determinism (${{ matrix.arch }})
    needs: landing-record
    if: ${{ !cancelled() && needs.landing-record.outputs.recorded != 'true' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-latest
          - arch: aarch64-macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Per-test determinism (one compiler build, two native builds per test)
        run: nix develop --command bash scripts/checks/lib/bounded.sh 3000 bash scripts/checks/compiler/determinism.sh

  scaling:
    name: Scaling (x86-64)
    needs: landing-record
    if: ${{ !cancelled() && needs.landing-record.outputs.recorded != 'true' }}
    defaults:
      run:
        shell: bash
    # Heavy scaling runs only on provisioned concrete-ci-2 self-hosted runners (ISS-0029 / X4),
    # never on GitHub-hosted VMs or macOS shared VMs, and never executes pull_request code on
    # concrete-ci-2. Pull requests run deterministic family coverage on a hosted runner.
    runs-on: ${{ github.event_name != 'pull_request' && fromJSON('["self-hosted","linux","x64","concrete","concrete-ci-2"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Refuse a substitute for concrete-ci-2
        if: github.event_name != 'pull_request' && runner.environment != 'self-hosted'
        run: |
          echo "::error::Scaling (x86-64) requires self-hosted concrete-ci-2; heavy qualification cannot use a hosted substitute"
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name != 'pull_request' && github.sha || '' }}
          persist-credentials: false
      - name: Install Nix (GitHub-hosted only)
        if: runner.environment != 'self-hosted'
        uses: cachix/install-nix-action@v31
      - name: Small deterministic family coverage (PR; no timing qualification)
        if: github.event_name == 'pull_request'
        run: nix develop --command bash scripts/checks/lib/bounded.sh 2400 env SCALING_TIER=pr bash scripts/checks/compiler/scaling.sh scaling-report
      - name: Interleaved 1x, 10x and 100x backend scaling
        if: github.event_name != 'pull_request'
        env:
          CONCRETE_SCALING_EXPECTED_SHA: ${{ github.sha }}
          CONCRETE_SCALING_EVENT_NAME: ${{ github.event_name }}
          CONCRETE_SCALING_REF: ${{ github.ref }}
          CONCRETE_SCALING_GITHUB_REPOSITORY: ${{ github.repository }}
          CONCRETE_SCALING_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CONCRETE_SCALING_RUNNER_NAME: ${{ runner.name }}
        run: nix develop --command bash scripts/checks/lib/bounded.sh 600 env SCALING_TIER=qualification bash scripts/checks/compiler/scaling.sh scaling-report
      - uses: actions/upload-artifact@v4
        if: always() && runner.environment == 'self-hosted'
        with:
          name: scaling-x86-64
          path: scaling-report
          if-no-files-found: error

  artifacts:
    name: Slice 0 artifacts (${{ matrix.arch }})
    needs: landing-record
    if: ${{ !cancelled() && needs.landing-record.outputs.recorded != 'true' }}
    # The compiler's devshell (flake.nix default: Lean, clang, LLVM, gdb/lldb), entered per step;
    # the gates shell has no Lean.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-latest
          - arch: aarch64-macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 160
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Sanitizers, binary size (report-only) and stack bound (gates 10, 11, 12)
        id: gate-artifacts
        run: python3 scripts/checks/lib/gate_manifest.py execute --id artifacts --tier ${{ github.event_name == 'pull_request' && 'pr' || 'qualification' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts-${{ matrix.arch }}
          path: ${{ steps.gate-artifacts.outputs.artifact_paths }}
          if-no-files-found: error

  trusted-base:
    name: Slice 0 trusted base (gate 9, ${{ matrix.arch }})
    needs: landing-record
    if: ${{ !cancelled() && needs.landing-record.outputs.recorded != 'true' }}
    # The compiler's devshell (flake.nix default: Lean, clang, LLVM, gdb/lldb), entered per step;
    # the gates shell has no Lean.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-latest
          - arch: aarch64-macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 160
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Trusted-base golden (premises, axioms, toolchain and LCB pin)
        run: python3 scripts/checks/lib/gate_manifest.py execute --id trusted-base --tier ${{ github.event_name == 'pull_request' && 'pr' || 'qualification' }}

  reproducibility:
    name: Reproducibility (${{ matrix.id }})
    needs: landing-record
    if: ${{ !cancelled() && needs.landing-record.outputs.recorded != 'true' }}
    # The compiler's devshell (flake.nix default: Lean, clang, LLVM, gdb/lldb), entered per step;
    # the gates shell has no Lean.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-first
            runner: ubuntu-24.04
          - id: linux-independent
            runner: ubuntu-24.04
          - id: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 190
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Compare every stage in distinct build directories
        id: gate-reproducibility
        run: python3 scripts/checks/lib/gate_manifest.py execute --id reproducibility --tier ${{ github.event_name == 'pull_request' && 'pr' || 'qualification' }}
      - uses: actions/upload-artifact@v4
        with:
          name: reproducibility-${{ matrix.id }}
          path: ${{ steps.gate-reproducibility.outputs.artifact_paths }}
          if-no-files-found: error

  compare-linux:
    name: Cross-machine reproducibility (x86-64 Linux)
    needs: reproducibility
    # Runs only when every reproducibility job ran (landing-record gate inherited); no Nix here.
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: reproducibility-linux-*
          path: manifests
      - name: Compare like targets, including compiler and toolchain identity
        run: python3 scripts/checks/lib/gate_manifest.py execute --id compare-linux --tier ${{ github.event_name == 'pull_request' && 'pr' || 'qualification' }}

