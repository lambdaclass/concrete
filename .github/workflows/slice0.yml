name: Slice 0 backends

# PROVISIONAL (ROADMAP B0, Concrete/README.md gates 4, 6 and 6a). The slice-0 backend gate,
# scripts/checks/slice0_backends.sh: every hand-written BIR example through the LLVM path and the
# LCB path, each executable's observation (exit status plus the fd-2 trap line) compared with the
# BIR semantics, plus LCB's own evaluator on the adapted body. It runs natively on x86-64 and on
# AArch64 (GitHub-hosted ARM runner), so the LCB output is executed on both targets. It joins
# required-checks.txt when the compiler lands on main; until then it runs on the slice-0 branches.

on:
  push:
    branches: ['wip/slice0', 'wip/slice0-*']
  workflow_dispatch:

concurrency:
  group: slice0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backends:
    name: Slice 0 backends (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Backend gate (LLVM and LCB, native)
        run: nix develop --command bash scripts/checks/slice0_backends.sh
