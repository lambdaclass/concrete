name: Branch health

# WHY THIS EXISTS.
#
# CI runs on `push` to `main` ONLY. A branch could therefore accumulate red gates
# indefinitely with nothing noticing, and one did: `spike/multi-kernel-theories` had ZERO CI
# runs across its whole life and arrived at merge with three separate gate failures —
# check_roadmap_linear (four task headings that broke the ID convention, so eight references
# to them read as dangling), check_div_migration, and check_contract_clause_migration. All
# three were found by a pre-push run on the MERGE, days after they were introduced, by
# someone who had not written them.
#
# WHY NOT JUST RUN FULL CI ON EVERY BRANCH. It takes 70+ minutes and its heaviest job alone
# is ~70. That cost is why nobody would leave it on, and a check people switch off is worse
# than one that never existed.
#
# So this runs the FAST SURFACE GATES only — measured at 14 seconds after a build. Of the
# three failures above, docs-drift is in this set and would have fired on the branch's FIRST
# push. The other two are mid-cost and stay in full CI; catching one of three immediately,
# for the price of a build, is the trade.
#
# WHAT THIS IS NOT. It is not a merge gate and does not claim a branch is good. It says the
# cheap, always-true invariants still hold — docs conventions, diagnostic-code completeness,
# the quadratic-append ratchet, the import firewall, constructor coverage. A green run here
# means nothing about whether the branch's own tests pass.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

# Same policy as CI: a later push to the same branch supersedes this run. A superseded run
# is NO VERDICT, not a failure — worth remembering, because reading `cancelled` as red cost
# two false alarms on main in one day.
concurrency:
  group: branch-health-${{ github.ref }}
  cancel-in-progress: true

# EVERY RUN STEP EXECUTES IN THE GATE USERLAND. Gates used to take coreutils, sed, grep, python and
# the rest from whatever runner they landed on (GNU on Linux, BSD on macOS, where `timeout` does not
# exist). `nix develop .#gates` (flake.nix) supplies one pinned set to every job, the dev shell
# included, and marks itself with CONCRETE_GATES_SHELL=1. It contains NO Lean: elan's toolchain
# (lean-action below) stays the one on PATH, so the checker identity CI records (R-0208) does not
# change. Self-hosted runners have Nix; each job installs it on a GitHub-hosted runner as its first
# step, before any run step. A job that needs another shell says so.
defaults:
  run:
    shell: "nix develop .#gates --command bash --noprofile --norc -eo pipefail {0}"

jobs:
  fast-gates:
    name: Fast surface gates
    # Its own self-hosted pool, `concrete-light` (docs/project/SELF_HOSTED_RUNNERS.md): every push
    # to every branch runs this, about 500 runs a day, and on CI's `concrete` pool they took 20-92
    # runner-minutes out of each train window (measured 2026-10-24). This workflow has no
    # pull_request trigger; the guard is kept so a future one can never reach a self-hosted runner.
    runs-on: ${{ (github.event_name != 'pull_request' && vars.CONCRETE_SELF_HOSTED == 'true') && fromJSON('["self-hosted","linux","x64","concrete-light"]') || 'ubuntu-latest' }}
    steps:
      # Full history: docs/bugs/AREAS.md (the docs-drift gate) derives each bug's area from its fix
      # commits, and the ledger generator refuses a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix (GitHub-hosted only)
        if: runner.environment != 'self-hosted'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Same cache key as CI's build job, so a branch push usually reuses main's artifacts
      # rather than paying a cold build.
      - name: Cache Lean build
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-lakebuild-${{ hashFiles('Concrete/**', 'Main.lean', 'lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}

      - name: Install Lean (via lean-action)
        uses: leanprover/lean-action@v1
        with:
          build-args: "--log-level=warning"

      # The gates need a compiler that matches the source; several run it. `lib/fresh.sh`
      # enforces that per-gate, but building here keeps the failure legible — a build error
      # should read as a build error, not as eleven gates failing at once.
      - name: Build
        run: lake build

      - name: Fast surface gates
        run: bash scripts/tests/run_fast_surface_gates.sh
