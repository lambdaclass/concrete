name: site

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Pages allows ONE in-flight deployment; back-to-back pushes raced and the
# second 400'd ("in progress deployment", lambdaclass run on 499f6420).
# Queue instead: newest deploy wins, older pending ones are cancelled.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zola
        # PINNED version + fail-fast curl. The old form asked the GitHub API
        # for the latest tag UNAUTHENTICATED — Actions runners share API rate
        # limits, so the call returned a rate-limit page, jq produced garbage,
        # and the 404 HTML was piped into tar ("not in gzip format",
        # lambdaclass/concrete run #145). Pinning removes both the rate limit
        # and latest-asset drift; -f makes any HTTP error fail the step loudly.
        run: |
          tag="v0.19.2"
          url="https://github.com/getzola/zola/releases/download/${tag}/zola-${tag}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir zola
          curl -fsSL "$url" | tar -xz --directory=./zola
          echo "$(pwd)/zola" >> "$GITHUB_PATH"

      # The browser compiler (site/static/compiler/concrete.{mjs,wasm}, manifest.json) is a build
      # output, not a committed file: it is cross-compiled here from this commit's compiler, and the
      # native/Wasm parity tests run before anything is published.
      - name: Cache Lean build (.lake/build, the same key as CI)
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-lakebuild-${{ hashFiles('Concrete/**', 'Concrete.lean', 'proofs/**', 'Main.lean', 'Browser.lean', 'lakefile.toml', 'lean-toolchain', 'lake-manifest.json') }}

      - name: Install Lean and build the compiler (via lean-action)
        uses: leanprover/lean-action@v1
        with:
          build-args: "--log-level=warning"

      - name: Cache the browser toolchains (Lean runtime source, Emscripten, leanrt)
        uses: actions/cache@v4
        with:
          path: .cache/browser
          key: ${{ runner.os }}-${{ runner.arch }}-browser-${{ hashFiles('lean-toolchain', 'scripts/browser/lean-runtime.patch', 'scripts/browser/build-site-compiler.sh') }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the browser compiler
        run: JOBS=4 bash scripts/browser/build-site-compiler.sh

      - name: Build Site
        # The language specification pages are generated from docs/spec (docs/spec/README.md §4);
        # base.html links @/spec/_index.md, so a build without this step fails instead of
        # publishing a site without the spec.
        run: |
          python3 scripts/spec/spec.py site --out site/content/spec
          python3 scripts/gen/site_reference.py --out site/content/reference
          zola --root site build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site/public/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
