name: Proof vacuity (N2 scoped audit)

# Called by the PR/landing CI as each contract migrates. There is no empty scope:
# an unmigrated whole spec cannot accidentally acquire a green N2 coverage job.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Fully qualified migrated ConcreteSpec module
        type: string
        required: true

permissions:
  contents: read

jobs:
  audit:
    name: Proof vacuity (manual scope)
    runs-on: ${{ vars.CONCRETE_SELF_HOSTED == 'true' && fromJSON('["self-hosted","linux","x64","concrete"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix (GitHub-hosted only)
        if: runner.environment != 'self-hosted'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--log-level=warning"
      - name: Exact-diagnostic controls
        run: nix develop .#gates --command bash scripts/proofs/vacuity.sh --controls
      - name: Structural audit of the required migrated scope
        env:
          N2_SCOPE: ${{ inputs.scope }}
        run: |
          test -n "$N2_SCOPE" || { echo "INCOMPLETE NOT MIGRATED (scope is required)"; exit 2; }
          nix develop .#gates --command bash scripts/proofs/vacuity.sh --scope "$N2_SCOPE"
